<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starry Christmas · Yıldızlı Noel Kartı</title>
  <meta name="description" content="A Christmas card with the real night sky over your city at midnight, drawn inside a Christmas bauble.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/astronomy.browser.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="garland" aria-hidden="true"></div>
  <header>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="tr">TR</button><button data-lang="en">EN</button>
    </div>
    <h1 data-t="title">Yıldızlı Noel Kartı</h1>
    <p class="subtitle" data-t="subtitle"></p>
  </header>

  <main>
    <section class="preview">
      <canvas id="card" width="1200" height="1800" role="img" aria-label="Christmas card with a star map"></canvas>
    </section>

    <form class="panel" onsubmit="return false">
      <label><span data-t="name"></span><input id="name" maxlength="40" autocomplete="off"></label>
      <label><span data-t="message"></span><textarea id="message" rows="2" maxlength="140"></textarea></label>
      <label><span data-t="city"></span>
        <input id="city" list="cities" autocomplete="off">
        <datalist id="cities"></datalist>
      </label>
      <button type="button" id="locate" class="link" data-t="locate"></button>
      <div class="row">
        <label class="grow"><span data-t="occasion"></span>
          <select id="occasion">
            <option value="christmas" data-t="christmas"></option>
            <option value="newyear" data-t="newyear"></option>
          </select>
        </label>
        <label class="year"><span data-t="year"></span><input id="year" type="number" min="1900" max="2100"></label>
      </div>
      <label><span data-t="greeting"></span><input id="greeting" maxlength="24" autocomplete="off"></label>
      <div class="row toggles">
        <label class="check"><input type="checkbox" id="lines"><span data-t="lines"></span></label>
        <label class="check"><input type="checkbox" id="names"><span data-t="names"></span></label>
      </div>
      <div class="actions">
        <button type="button" id="download" class="primary" data-t="download"></button>
        <button type="button" id="share" class="secondary" data-t="share"></button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <p data-t="credit"></p>
    <p><a href="https://github.com/sayko89/starry-christmas">GitHub</a> · Safiye Özkan</p>
  </footer>
</body>
</html>
