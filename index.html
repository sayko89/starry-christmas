<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starry Christmas · Yıldızlı Noel Kartı</title>
  <meta name="description" content="A Christmas card with the real night sky over your city at midnight, above a snowy forest where a sleigh is waiting.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": {
    "three": "./vendor/three.min.js",
    "three/addons/postprocessing/EffectComposer.js": "./vendor/three.min.js",
    "three/addons/postprocessing/RenderPass.js": "./vendor/three.min.js",
    "three/addons/postprocessing/UnrealBloomPass.js": "./vendor/three.min.js",
    "three/addons/postprocessing/OutputPass.js": "./vendor/three.min.js"
  } }</script>
  <script src="vendor/astronomy.browser.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Opening: a flight down a Christmas street up into the stars, then the questions -->
  <section id="stage" hidden>
    <canvas id="sky3d" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="stage-lang lang" role="group" aria-label="Language">
      <button data-lang="tr">TR</button><button data-lang="en">EN</button>
    </div>
    <button id="skip" class="skip" type="button"><span data-q="skip">Geç</span> ›</button>

    <div id="welcome" class="screen" hidden>
      <p id="w-kicker" class="kicker"></p>
      <h2 id="w-title" class="snowy big"></h2>
      <p id="w-sub" class="sub"></p>
      <button id="w-start" type="button" class="primary start"></button>
    </div>

    <form id="quiz" class="screen" hidden onsubmit="return false">
      <div class="ornaments" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h2 id="q-title" class="snowy"></h2>
      <p id="q-hint" class="sub"></p>
      <div id="q-body"></div>
      <div class="q-nav">
        <button id="q-back" type="button" class="secondary"></button>
        <button id="q-next" type="button" class="primary"></button>
      </div>
    </form>
  </section>

  <div id="editor" hidden>
  <div class="garland" aria-hidden="true"></div>
  <header>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="tr">TR</button><button data-lang="en">EN</button>
    </div>
    <h1 data-t="title">Yıldızlı Noel Kartı</h1>
    <p class="subtitle" data-t="subtitle"></p>
  </header>

  <main>
    <section class="preview">
      <canvas id="card" width="1200" height="1800" role="img" aria-label="Christmas card with a star map"></canvas>
    </section>

    <form class="panel" onsubmit="return false">
      <label><span data-t="name"></span><input id="name" maxlength="40" autocomplete="off"></label>
      <label><span data-t="message"></span><textarea id="message" rows="2" maxlength="140"></textarea></label>
      <label><span data-t="city"></span>
        <input id="city" list="cities" autocomplete="off">
        <datalist id="cities"></datalist>
      </label>
      <button type="button" id="locate" class="link" data-t="locate"></button>
      <div class="row">
        <label class="grow"><span data-t="occasion"></span>
          <select id="occasion">
            <option value="christmas" data-t="christmas"></option>
            <option value="newyear" data-t="newyear"></option>
          </select>
        </label>
        <label class="year"><span data-t="year"></span><input id="year" type="number" min="1900" max="2100"></label>
      </div>
      <label><span data-t="greeting"></span><input id="greeting" maxlength="24" autocomplete="off"></label>
      <div class="row toggles">
        <label class="check"><input type="checkbox" id="lines"><span data-t="lines"></span></label>
        <label class="check"><input type="checkbox" id="names"><span data-t="names"></span></label>
      </div>
      <div class="actions">
        <button type="button" id="download" class="primary" data-t="download"></button>
        <button type="button" id="share" class="secondary" data-t="share"></button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <p data-t="credit"></p>
    <p><a href="./" id="replay" data-t="replay"></a> · <a href="https://github.com/sayko89/starry-christmas">GitHub</a> · Safiye Özkan</p>
  </footer>
  </div>
</body>
</html>
